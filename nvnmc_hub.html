<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NVNMC • Server Hub</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:Arial,system-ui,sans-serif;color:#fff;background:
radial-gradient(circle at 20% 10%,#3b1d68 0,transparent 35%),
radial-gradient(circle at 80% 90%,#103c5c 0,transparent 35%),#090b13}
.container{width:min(940px,92%);margin:auto;padding:38px 0 50px}
.card{background:rgba(17,20,32,.78);border:1px solid rgba(255,255,255,.1);border-radius:24px;padding:28px;box-shadow:0 20px 70px #0008;backdrop-filter:blur(14px)}
.logo{font-size:clamp(34px,9vw,64px);font-weight:900;letter-spacing:2px;margin:0}
.sub{color:#aeb6c8;margin:8px 0 25px}
.status{display:flex;align-items:center;gap:12px;padding:16px 18px;border-radius:16px;background:#ffffff0a;margin-bottom:20px}
.dot{width:13px;height:13px;border-radius:50%;background:#777;box-shadow:0 0 14px #777}
.online .dot{background:#37e879;box-shadow:0 0 16px #37e879}
.offline .dot{background:#ff4d67;box-shadow:0 0 16px #ff4d67}
.maintenance .dot{background:#ffc34d;box-shadow:0 0 16px #ffc34d}
.status b{font-size:18px}.status small{display:block;color:#9ba5b8;margin-top:3px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:22px}
.stat{padding:17px;border-radius:17px;background:#ffffff08;border:1px solid #ffffff0d}
.stat span{display:block;color:#8993a7;font-size:13px}.stat strong{display:block;margin-top:7px;font-size:18px}
.buttons{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
button,.btn{border:0;border-radius:15px;padding:16px;font-size:15px;font-weight:800;text-decoration:none;text-align:center;cursor:pointer;color:#fff;background:#ffffff10;border:1px solid #ffffff14;transition:.2s}
button:hover,.btn:hover{transform:translateY(-2px);background:#ffffff18}
.primary{background:linear-gradient(135deg,#7c4dff,#00a8ff)!important}
.donate{background:linear-gradient(135deg,#e33d73,#ff8a3d)!important}
footer{text-align:center;color:#70798b;font-size:13px;margin-top:20px}
@media(max-width:620px){.container{padding-top:20px}.card{padding:20px}.grid{grid-template-columns:1fr 1fr}.buttons{grid-template-columns:1fr}.stat:last-child{grid-column:1/-1}}
</style>
</head>
<body>
<div class="container">
  <main class="card">
    <h1 class="logo">NVNMC</h1>
    <p class="sub">Minecraft Server • Community Hub</p>

    <section id="status" class="status">
      <i class="dot"></i>
      <div>
        <b id="statusText">Đang kiểm tra...</b>
        <small id="statusDetail">Đang kết nối tới server</small>
      </div>
    </section>

    <section class="grid">
      <div class="stat"><span>👥 Người chơi</span><strong id="players">-- / --</strong></div>
      <div class="stat"><span>🎮 Phiên bản</span><strong id="version">--</strong></div>
      <div class="stat"><span>📡 Ping</span><strong id="ping">--</strong></div>
    </section>

    <section class="buttons">
      <button class="primary" onclick="copyIP()">📋 COPY IP</button>
      <a class="btn" href="https://discord.gg/cTfvzavyqU" target="_blank" rel="noopener">💬 DISCORD</a>
      <a class="btn donate" href="https://dash.nvnmc.cloud/s/bb18bccc-a791-4f5b-b735-6ba366ba9e99" target="_blank" rel="noopener">❤️ ỦNG HỘ SERVER</a>
      <a class="btn" href="minecraft://?addExternalServer=NVNMC|nvnmc.asia:26116">🎮 MỞ MINECRAFT</a>
    </section>
  </main>
  <footer>NVNMC • Tự động cập nhật trạng thái mỗi 30 giây</footer>
</div>

<script>
const HOST="nvnmc.asia", PORT=26116;
const API=`https://api.mcstatus.io/v2/status/java/${HOST}:${PORT}`;

async function checkServer(){
  const box=document.getElementById("status");
  try{
    const t=performance.now();
    const r=await fetch(API,{cache:"no-store"});
    const d=await r.json();
    const elapsed=Math.round(performance.now()-t);

    if(d.online){
      box.className="status online";
      document.getElementById("statusText").textContent="SERVER ONLINE";
      document.getElementById("statusDetail").textContent=d.motd?.clean || "Server đang hoạt động";
      document.getElementById("players").textContent=`${d.players?.online ?? 0} / ${d.players?.max ?? "?"}`;
      document.getElementById("version").textContent=d.version?.name_clean || d.version?.name || "--";
      document.getElementById("ping").textContent=(d.latency ?? elapsed)+" ms";
    }else{
      setOffline("SERVER OFFLINE","Không thể kết nối tới server");
    }
  }catch(e){
    setOffline("KHÔNG THỂ KIỂM TRA","API trạng thái tạm thời không phản hồi");
  }
}
function setOffline(title,detail){
  document.getElementById("status").className="status offline";
  document.getElementById("statusText").textContent=title;
  document.getElementById("statusDetail").textContent=detail;
  document.getElementById("players").textContent="-- / --";
  document.getElementById("version").textContent="--";
  document.getElementById("ping").textContent="--";
}
async function copyIP(){
  try{
    await navigator.clipboard.writeText(`${HOST}:${PORT}`);
    alert("Đã copy IP: "+HOST+":"+PORT);
  }catch(e){prompt("Copy IP:",`${HOST}:${PORT}`)}
}
checkServer();
setInterval(checkServer,30000);
</script>
</body>
</html>
